#if LOW_HEALTH_EFFECT_START > 0 || CRITICALLY_LOW_HEALTH_EFFECT_START > 0 || MINOR_DAMAGE_TAKEN_EFFECT_START > 0 || CRITICAL_DAMAGE_TAKEN_EFFECT_START > 0
    #ifdef IS_IRIS
        variable.float.Currenthealth = currentPlayerHealth * maxPlayerHealth
        uniform.float.oneHeart = smooth(if(Currenthealth <= CRITICALLY_LOW_HEALTH_EFFECT_START && currentPlayerHealth > -1.0, 1,0), 0.0,1.0)
        uniform.float.threeHeart = smooth(if(Currenthealth <= max(LOW_HEALTH_EFFECT_START,CRITICALLY_LOW_HEALTH_EFFECT_START) && currentPlayerHealth > -1.0, 1,0), 0.0,1.0)

        variable.float.lerptime2 = if(is_hurt, 1.0, 0.0)
